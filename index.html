<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif}

/* 弹窗遮罩 */
#modal-overlay{
  display:flex;
  position:fixed;inset:0;
  background:rgba(0,0,50,.45);
  z-index:2000;
  align-items:center;
  justify-content:center;
  padding:1em;
}

/* 弹窗卡片 */
#modal-card{
  background:#fff;
  border-radius:.6em;
  padding:2em 2em 1.5em;
  max-width:420px;
  width:100%;
  text-align:center;
  box-shadow:0 12px 48px rgba(0,0,0,.35);
  animation:popIn .35s ease;
  position:relative;
}
@keyframes popIn{
  0%{transform:scale(.7);opacity:0}
  45%{transform:scale(1.05)}
  80%{transform:scale(.95)}
  100%{transform:scale(1);opacity:1}
}

/* 抖动动画 */
@keyframes shake{
  0%,100%{transform:translateX(0)}
  10%,30%,50%,70%,90%{transform:translateX(-7px)}
  20%,40%,60%,80%{transform:translateX(7px)}
}
.shake{animation:shake .5s ease}

/* 标题 */
#modal-card h2{
  color:#333;
  font-size:1.35em;
  line-height:1.5;
  margin-bottom:.3em;
}
#modal-card h2 small{display:block;margin-top:.2em;color:#888}

/* 输入框 */
#answer-input{
  display:block;
  width:88%;
  max-width:320px;
  margin:.6em auto;
  padding:.65em 1em;
  font-size:1.1em;
  border:1.5px solid #ccc;
  border-radius:.35em;
  outline:none;
  transition:border .2s,box-shadow .2s;
}
#answer-input:focus{
  border-color:#5b9dd9;
  box-shadow:0 0 0 3px rgba(91,157,217,.25);
}
#answer-input.err{
  border-color:#e74c3c;
  box-shadow:0 0 0 3px rgba(231,76,60,.2);
  animation:shake .4s ease;
}

/* 按钮 */
#submit-btn{
  display:inline-block;
  margin-top:.8em;
  padding:.6em 2.2em;
  font-size:1.05em;
  font-weight:500;
  color:#fff;
  background:#3085d6;
  border:none;
  border-radius:.3em;
  cursor:pointer;
  transition:background .2s;
}
#submit-btn:hover{background:#2673bb}
#submit-btn:active{background:#1d5a93}

/* 错误提示 */
#error-msg{
  display:none;
  margin-top:.7em;
  padding:.5em .8em;
  background:#fdecea;
  color:#c0392b;
  font-size:.9em;
  border-radius:.3em;
  border:1px solid #f5c6cb;
}
#error-msg.show{display:block}

/* ================================================
   解锁页面
   ================================================ */
#unlock-page{
  display:none;
  position:fixed;inset:0;
  background:linear-gradient(135deg,#1a1a4e 0%,#0d0d2b 100%);
  background-size:cover;background-position:center;
  z-index:1000;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:2em 1em;
}

#unlock-page .content-wrap{
  max-width:90vw;
}

#toptext{
  color:#fff;
  font-size:1.6em;
  font-weight:700;
  margin-bottom:.5em;
  text-shadow:0 2px 12px rgba(0,0,0,.6);
  letter-spacing:.02em;
}

.sptp{
  width:80vw;
  max-width:500px;
  margin:0 auto;
}
.sptp img{
  width:100%;
  max-height:58vh;
  object-fit:contain;
  border-radius:1em;
  box-shadow:0 8px 40px rgba(0,0,0,.5);
}

.sps{
  margin-top:.9em;
  font-size:1.1em;
  color:rgba(255,255,255,.88);
  text-shadow:0 1px 6px rgba(0,0,0,.5);
}

/* 底部按钮 */
.div-btn{
  position:fixed;
  bottom:80px;right:16px;
  width:38px;height:38px;
  border:2px solid rgba(255,255,255,.75);
  border-radius:50%;
  background:rgba(0,0,0,.35);
  text-align:center;line-height:40px;
  z-index:999;cursor:pointer;
  backdrop-filter:blur(4px);
}
.div-btn a{color:#fff;text-decoration:none;font-size:.85em;text-shadow:0 1px 3px #000}
.div-btn:hover{background:rgba(0,0,0,.55)}

/* 响应式 */
@media(max-width:480px){
  #modal-card{padding:1.5em 1.2em 1.2em}
  #modal-card h2{font-size:1.2em}
  #toptext{font-size:1.3em}
  .sps{font-size:1em}
}
</style>
</head>
<body>

<!-- ====== 弹窗 ====== -->
<div id="modal-overlay">
  <div id="modal-card">
    <h2>
      <b>情人节领取专属对象神器</b>
      <small>↓</small>
      <small id="hint-text">请输入"520"</small>
    </h2>
    <input type="text" id="answer-input" placeholder="哇" autocomplete="off">
    <button id="submit-btn">一键领取！</button>
    <div id="error-msg">输入"520"，否则无法领取~</div>
  </div>
</div>

inp.addEventListener('keydown', e => { if(e.key==='Enter') check(); });
inp.addEventListener('input', () => {
  errMsg.classList.remove('show');
  inp.classList.remove('err');
});

function check() {
  if (step === 1) {
    // 第一次：创建输入框并聚焦
    step = 2;
    hintText.textContent = '请输入正确答案';
    inp.style.display = 'block';
    inp.focus();
    btn.textContent = '确认';
    return;
  }

  // 第二次：检查答案
  const v = inp.value.trim();
  if (v === CFG.answer) {
    unlock();
  } else {
    errMsg.classList.add('show');
    inp.classList.add('err');
    // 移除抖动重新触发
    card.classList.remove('shake');
    void card.offsetWidth;
    card.classList.add('shake');
  }
}

function unlock() {
  // 隐藏弹窗
  overlay.style.display = 'none';

  // 显示解锁页
  unlockPage.style.cssText = CFG.bgStyle;
  unlockPage.style.display = 'flex';

  toptextEl.textContent = CFG.topText;
  subTextEl.textContent = CFG.subText;

  // 图片
  revealImg.src = CFG.revealImg;

  // 音乐
  if (CFG.bgmUrl) {
    bgm.src = CFG.bgmUrl;
    bgm.play().catch(()=>{});
  }

  // 底部按钮
  bottomBtn.style.display = 'block';
}
</script>
</body>
</html>
